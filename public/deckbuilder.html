<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck Builder - Grid Card Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: #e2e8f0; overflow-x: hidden; }
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.4; animation: pulse-orb 3s ease-in-out infinite; z-index: 0; pointer-events: none; }
    .bg-orb-1 { width: 400px; height: 400px; background: #a855f7; top: -100px; left: -100px; }
    .bg-orb-2 { width: 300px; height: 300px; background: #fbbf24; bottom: -50px; right: -50px; animation-delay: -1.5s; }
    @keyframes pulse-orb { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.2); opacity: 0.5; } }
    .page-container { display: flex; flex-direction: column; min-height: 100vh; position: relative; z-index: 1; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: rgba(20, 20, 40, 0.9); border-bottom: 2px solid rgba(138, 43, 226, 0.4); }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .back-btn { padding: 8px 16px; background: rgba(100, 116, 139, 0.3); border: 1px solid rgba(100, 116, 139, 0.5); border-radius: 8px; color: #94a3b8; font-size: 13px; cursor: pointer; text-decoration: none; transition: all 0.2s; }
    .back-btn:hover { background: rgba(100, 116, 139, 0.5); color: #e2e8f0; }
    .page-title { font-family: 'Cinzel', serif; font-size: 24px; background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .save-btn { padding: 8px 20px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 8px; color: white; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .save-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .main-content { display: flex; flex: 1; gap: 15px; padding: 15px; overflow: hidden; }
    .panel { background: rgba(20, 20, 40, 0.9); border: 2px solid rgba(138, 43, 226, 0.4); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: rgba(30, 30, 60, 0.5); border-bottom: 1px solid rgba(138, 43, 226, 0.3); }
    .panel-title { font-family: 'Cinzel', serif; font-size: 14px; color: #a78bfa; }
    .card-details-panel { width: 320px; flex-shrink: 0; }
    .card-preview { padding: 15px; display: flex; flex-direction: column; align-items: center; flex: 1; overflow-y: auto; }
    .preview-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #64748b; text-align: center; }
    .preview-placeholder-icon { font-size: 48px; margin-bottom: 10px; opacity: 0.5; }
    .preview-card { width: 100%; max-width: 280px; position: relative; }
    /* Rarity glow container */
    .preview-card-glow { position: relative; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
    .preview-card-glow.rarity-common { background: rgba(30, 30, 60, 0.5); border: 2px solid rgba(148, 163, 184, 0.5); }
    /* Rare - blue glow */
    .preview-card-glow.rarity-rare { background: rgba(20, 30, 80, 0.6); border: 3px solid rgba(59, 130, 246, 0.9); box-shadow: 0 0 25px rgba(59, 130, 246, 0.5), 0 0 50px rgba(59, 130, 246, 0.3), inset 0 0 30px rgba(59, 130, 246, 0.15); }
    .preview-card-glow.rarity-rare::before { content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; background: conic-gradient(from 0deg, transparent, rgba(59, 130, 246, 0.6), transparent, rgba(59, 130, 246, 0.4), transparent, rgba(59, 130, 246, 0.6), transparent); border-radius: 14px; z-index: -1; animation: spin-rays 6s linear infinite; }
    .preview-card-glow.rarity-rare::after { content: ''; position: absolute; top: 50%; left: 50%; width: 120%; height: 120%; background: radial-gradient(ellipse, rgba(59, 130, 246, 0.2) 0%, transparent 60%); transform: translate(-50%, -50%); z-index: -2; animation: pulse-glow-rare 3s ease-in-out infinite; }
    /* Legendary - intense gold glow */
    .preview-card-glow.rarity-legendary { background: rgba(60, 50, 20, 0.6); border: 3px solid rgba(251, 191, 36, 1); box-shadow: 0 0 30px rgba(251, 191, 36, 0.7), 0 0 60px rgba(251, 191, 36, 0.5), 0 0 90px rgba(251, 191, 36, 0.3), inset 0 0 40px rgba(251, 191, 36, 0.2); }
    .preview-card-glow.rarity-legendary::before { content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px; background: conic-gradient(from 0deg, rgba(251, 191, 36, 0.9), rgba(245, 158, 11, 0.4), rgba(251, 191, 36, 0.9), rgba(245, 158, 11, 0.4), rgba(251, 191, 36, 0.9), rgba(245, 158, 11, 0.4), rgba(251, 191, 36, 0.9)); border-radius: 16px; z-index: -1; animation: spin-rays 3s linear infinite; filter: blur(2px); }
    .preview-card-glow.rarity-legendary::after { content: ''; position: absolute; top: 50%; left: 50%; width: 180%; height: 180%; background: radial-gradient(ellipse, rgba(251, 191, 36, 0.4) 0%, rgba(245, 158, 11, 0.2) 30%, transparent 60%); transform: translate(-50%, -50%); z-index: -2; animation: pulse-glow-legendary 1.5s ease-in-out infinite; }
    /* Extra light rays for legendary */
    .preview-card-glow.rarity-legendary .preview-art { box-shadow: 0 0 20px rgba(251, 191, 36, 0.3); }
    @keyframes spin-rays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse-glow-rare { 0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } }
    @keyframes pulse-glow-legendary { 0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }
    .preview-art { width: 100%; height: 200px; background-color: rgba(30, 30, 60, 0.5); background-size: cover; background-position: center top; border-radius: 8px; }
    .preview-art.void-alien { background-color: rgba(6, 95, 70, 0.3); }
    .preview-art.crimson-court { background-color: rgba(127, 29, 29, 0.3); }
    .preview-name { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: #fbbf24; text-align: center; margin-bottom: 8px; margin-top: 10px; }
    .preview-type { font-size: 12px; color: #94a3b8; text-align: center; margin-bottom: 12px; }
    .preview-stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
    .preview-stat { display: flex; flex-direction: column; align-items: center; padding: 8px 12px; background: rgba(30, 30, 60, 0.8); border-radius: 8px; }
    .preview-stat-value { font-size: 22px; font-weight: 800; }
    .preview-stat-label { font-size: 9px; color: #64748b; text-transform: uppercase; }
    .stat-cost { color: #3b82f6; } .stat-atk { color: #f97316; } .stat-hp { color: #06b6d4; }
    .preview-effect { background: rgba(30, 30, 60, 0.8); border: 1px solid rgba(138, 43, 226, 0.3); border-radius: 8px; padding: 12px; margin-bottom: 15px; width: 100%; }
    .preview-effect-label { font-size: 10px; color: #a78bfa; text-transform: uppercase; margin-bottom: 5px; }
    .preview-effect-text { font-size: 12px; color: #e2e8f0; line-height: 1.4; }
    .preview-no-effect { color: #64748b; font-style: italic; }
    .preview-owned { font-size: 12px; color: #94a3b8; margin-bottom: 15px; text-align: center; }
    .preview-owned span { color: #fbbf24; font-weight: 700; }
    .preview-buttons { display: flex; gap: 10px; width: 100%; }
    .preview-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .preview-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-add { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .btn-add:hover:not(:disabled) { transform: translateY(-2px); }
    .btn-remove { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
    .btn-remove:hover:not(:disabled) { transform: translateY(-2px); }
    .collection-panel { flex: 1; min-width: 350px; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; background: rgba(30, 30, 60, 0.3); border-bottom: 1px solid rgba(138, 43, 226, 0.2); align-items: center; }
    .filter-group { display: flex; align-items: center; gap: 4px; }
    .filter-group label { color: #94a3b8; font-size: 10px; }
    .search-input { padding: 5px 8px; background: rgba(30, 30, 60, 0.8); border: 1px solid rgba(138, 43, 226, 0.3); border-radius: 5px; color: #e2e8f0; font-size: 11px; width: 90px; }
    .search-input:focus { outline: none; border-color: rgba(138, 43, 226, 0.6); }
    .filter-select { padding: 5px 6px; background: rgba(30, 30, 60, 0.8); border: 1px solid rgba(138, 43, 226, 0.3); border-radius: 5px; color: #e2e8f0; font-size: 11px; cursor: pointer; }
    .filter-btn { padding: 5px 8px; background: rgba(30, 30, 60, 0.5); border: 1px solid rgba(138, 43, 226, 0.3); border-radius: 5px; color: #94a3b8; font-size: 10px; cursor: pointer; }
    .filter-btn:hover { background: rgba(138, 43, 226, 0.3); color: #e2e8f0; }
    .card-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; padding: 10px; overflow-y: auto; align-content: start; }
    .card-grid::-webkit-scrollbar { width: 6px; }
    .card-grid::-webkit-scrollbar-track { background: rgba(30, 30, 60, 0.5); }
    .card-grid::-webkit-scrollbar-thumb { background: rgba(138, 43, 226, 0.5); border-radius: 3px; }
    .collection-card { position: relative; aspect-ratio: 3/4; background: linear-gradient(145deg, rgba(30, 30, 60, 0.9), rgba(20, 20, 40, 0.9)); border: 2px solid rgba(138, 43, 226, 0.4); border-radius: 8px; overflow: hidden; cursor: pointer; transition: all 0.2s; }
    .collection-card:hover { transform: translateY(-3px); }
    .collection-card.selected { border-color: #fbbf24 !important; box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }
    .collection-card.in-deck { box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.4); }
    .collection-card.not-owned { opacity: 0.4; filter: grayscale(0.5); }
    .collection-card.locked { cursor: not-allowed; }
    .collection-card.locked:hover { transform: none; }
    .collection-card.locked .card-art { display: none; }
    .collection-card.locked .card-cost { display: none; }
    .collection-card.locked .card-count { display: none; }
    .collection-card.locked .rarity-gem { display: none; }
    .collection-card.locked .card-info { display: none; }
    .locked-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(145deg, rgba(40, 40, 60, 0.95), rgba(30, 30, 50, 0.95)); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .locked-icon { font-size: 28px; margin-bottom: 5px; opacity: 0.6; }
    .locked-text { font-size: 9px; color: #64748b; text-align: center; padding: 0 5px; }
    /* Rarity borders */
    .collection-card.rarity-common { border-color: rgba(148, 163, 184, 0.6); }
    .collection-card.rarity-common:hover { border-color: rgba(148, 163, 184, 0.9); }
    .collection-card.rarity-rare { border-color: rgba(59, 130, 246, 0.7); box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }
    .collection-card.rarity-rare:hover { border-color: rgba(59, 130, 246, 1); box-shadow: 0 0 12px rgba(59, 130, 246, 0.5); }
    .collection-card.rarity-legendary { border-color: rgba(251, 191, 36, 0.7); box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
    .collection-card.rarity-legendary:hover { border-color: rgba(251, 191, 36, 1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); }
    .collection-card.locked { border-color: rgba(100, 100, 120, 0.4) !important; box-shadow: none !important; }
    
    /* === HOLOGRAPHIC CARD EFFECTS BY RARITY === */
    
    /* Base holo styling */
    .collection-card.holo { 
      position: relative; 
      border: 2px solid transparent;
      background: linear-gradient(145deg, rgba(30, 30, 60, 0.9), rgba(20, 20, 40, 0.9));
    }
    .collection-card.holo .card-art { position: relative; }
    
    /* COMMON HOLO - Purple/pink gradient shimmer */
    .collection-card.holo.rarity-common::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, #a855f7, #ec4899, #a855f7);
      background-size: 200% 200%;
      border-radius: 10px;
      z-index: -1;
      animation: holoCommonShift 4s ease-in-out infinite;
    }
    .collection-card.holo.rarity-common .card-art::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 200%;
      animation: holoShine 3s ease-in-out infinite;
      pointer-events: none;
    }
    .collection-card.holo.rarity-common .card-count {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.9), rgba(236, 72, 153, 0.9));
      color: white;
    }
    @keyframes holoCommonShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    /* RARE HOLO - Electric blue plasma effect */
    .collection-card.holo.rarity-rare::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      background: linear-gradient(45deg, #06b6d4, #3b82f6, #8b5cf6, #06b6d4);
      background-size: 300% 300%;
      border-radius: 10px;
      z-index: -1;
      animation: holoRareShift 2s linear infinite;
      filter: blur(1px);
    }
    .collection-card.holo.rarity-rare::after {
      content: '⚡';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      opacity: 0;
      animation: holoRareSpark 2s ease-in-out infinite;
      pointer-events: none;
      z-index: 10;
    }
    .collection-card.holo.rarity-rare .card-art::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(103, 232, 249, 0.4), transparent);
      animation: holoRareStreak 2s ease-in-out infinite;
    }
    .collection-card.holo.rarity-rare .card-count {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.9), rgba(59, 130, 246, 0.9));
      color: white;
    }
    @keyframes holoRareShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    @keyframes holoRareSpark {
      0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.3); }
    }
    @keyframes holoRareStreak {
      0% { left: -100%; }
      100% { left: 200%; }
    }
    
    /* LEGENDARY HOLO - Full prismatic rainbow explosion */
    .collection-card.holo.rarity-legendary::before {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      background: linear-gradient(45deg, 
        #ff0000, #ff4400, #ff8800, #ffcc00, #ffff00, 
        #88ff00, #00ff00, #00ff88, #00ffff, #0088ff, 
        #0000ff, #4400ff, #8800ff, #ff00ff, #ff0088, #ff0000);
      background-size: 600% 600%;
      border-radius: 10px;
      z-index: -1;
      animation: holoLegendaryRainbow 2s linear infinite;
      filter: blur(2px);
    }
    .collection-card.holo.rarity-legendary::after {
      content: '👑';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      animation: holoLegendaryCrown 1s ease-in-out infinite;
      pointer-events: none;
      z-index: 10;
      filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.8));
    }
    .collection-card.holo.rarity-legendary .card-art::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(from 0deg, 
        transparent 0deg, rgba(255,215,0,0.3) 60deg, transparent 120deg,
        rgba(255,140,0,0.3) 180deg, transparent 240deg,
        rgba(255,69,0,0.3) 300deg, transparent 360deg);
      animation: holoLegendarySpin 3s linear infinite;
      pointer-events: none;
    }
    .collection-card.holo.rarity-legendary .card-art::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4) 0%, transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(255,215,0,0.3) 0%, transparent 40%);
      animation: holoLegendarySparkle 1.5s ease-in-out infinite;
      z-index: 1;
    }
    .collection-card.holo.rarity-legendary .card-count {
      background: linear-gradient(135deg, rgba(251, 191, 36, 1), rgba(245, 158, 11, 1));
      color: #1a1a2e;
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }
    .collection-card.holo.rarity-legendary .card-name {
      color: #fcd34d !important;
      text-shadow: 0 0 4px rgba(251, 191, 36, 0.5);
    }
    @keyframes holoLegendaryRainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 600% 50%; }
    }
    @keyframes holoLegendarySpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes holoLegendaryCrown {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(-5deg); }
      50% { transform: translateX(-50%) translateY(-3px) rotate(5deg); }
    }
    @keyframes holoLegendarySparkle {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    @keyframes holoShine {
      0% { background-position: -100% -100%; }
      100% { background-position: 200% 200%; }
    }
    /* Rarity gem indicator */
    .rarity-gem { position: absolute; bottom: 3px; right: 3px; width: 10px; height: 10px; border-radius: 50%; }
    .rarity-gem.common { background: linear-gradient(135deg, #94a3b8, #64748b); }
    .rarity-gem.rare { background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
    .rarity-gem.legendary { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 0 5px rgba(251, 191, 36, 0.6); }
    .card-art { width: 100%; height: 55%; background-color: rgba(30, 30, 60, 0.5); background-size: cover; background-position: center top; }
    .card-art.void-alien { background-color: rgba(6, 95, 70, 0.3); background-size: cover; background-position: center top; }
    .card-art.crimson-court { background-color: rgba(127, 29, 29, 0.3); background-size: cover; background-position: center top; }
    .card-cost { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; background: linear-gradient(135deg, #3b82f6, #2563eb); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 10px; color: white; }
    .card-count { position: absolute; top: 3px; left: 3px; background: rgba(0, 0, 0, 0.8); padding: 1px 5px; border-radius: 6px; font-size: 9px; font-weight: 600; color: #fbbf24; }
    .card-count.none { color: #ef4444; }
    .card-info { padding: 5px; background: linear-gradient(to top, rgba(15, 15, 35, 1), rgba(15, 15, 35, 0.8)); height: 45%; display: flex; flex-direction: column; justify-content: space-between; }
    .card-name { font-family: 'Cinzel', serif; font-size: 8px; font-weight: 700; color: #e2e8f0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-stats { display: flex; justify-content: center; gap: 6px; font-size: 9px; font-weight: 600; }
    .card-atk { color: #f97316; } .card-hp { color: #06b6d4; }
    .deck-panel { width: 280px; flex-shrink: 0; }
    .deck-selector-section { padding: 10px 12px; background: rgba(30, 30, 60, 0.5); border-bottom: 1px solid rgba(138, 43, 226, 0.3); }
    .deck-select { width: 100%; padding: 8px 10px; background: rgba(20, 20, 40, 0.8); border: 1px solid rgba(138, 43, 226, 0.4); border-radius: 6px; color: #e2e8f0; font-size: 12px; cursor: pointer; }
    .deck-name-section { padding: 10px 12px; background: rgba(30, 30, 60, 0.3); border-bottom: 1px solid rgba(138, 43, 226, 0.2); }
    .deck-name-input { width: 100%; padding: 8px 10px; background: rgba(20, 20, 40, 0.8); border: 1px solid rgba(138, 43, 226, 0.4); border-radius: 6px; color: #fbbf24; font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700; text-align: center; }
    .deck-name-input:focus { outline: none; border-color: rgba(251, 191, 36, 0.6); }
    .deck-name-input::placeholder { color: #64748b; }
    .deck-customization { padding: 10px 12px; background: rgba(30, 30, 60, 0.3); border-bottom: 1px solid rgba(138, 43, 226, 0.2); }
    .customization-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .customization-row:last-child { margin-bottom: 0; }
    .customization-row label { font-size: 11px; color: #94a3b8; min-width: 85px; }
    .customization-select { flex: 1; padding: 6px 8px; background: rgba(20, 20, 40, 0.8); border: 1px solid rgba(138, 43, 226, 0.4); border-radius: 5px; color: #e2e8f0; font-size: 11px; cursor: pointer; }
    .customization-select:focus { outline: none; border-color: rgba(251, 191, 36, 0.6); }

    /* Holo deck card - base */
    .deck-card-item.holo-deck-card { 
      position: relative;
      overflow: hidden;
    }
    .deck-card-item.holo-deck-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; right: 0; bottom: 0;
      width: 200%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: deckHoloShine 2s ease-in-out infinite;
    }
    /* Common holo deck card */
    .deck-card-item.holo-deck-card.holo-common { 
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.2)); 
      border-color: rgba(168, 85, 247, 0.5);
    }
    .deck-card-item.holo-deck-card.holo-common .deck-card-name { color: #e879f9; }
    /* Rare holo deck card */
    .deck-card-item.holo-deck-card.holo-rare { 
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2)); 
      border-color: rgba(59, 130, 246, 0.6);
    }
    .deck-card-item.holo-deck-card.holo-rare .deck-card-name { color: #67e8f9; text-shadow: 0 0 5px rgba(103, 232, 249, 0.5); }
    /* Legendary holo deck card */
    .deck-card-item.holo-deck-card.holo-legendary { 
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.2)); 
      border-color: rgba(251, 191, 36, 0.7);
      box-shadow: inset 0 0 10px rgba(251, 191, 36, 0.2);
    }
    .deck-card-item.holo-deck-card.holo-legendary .deck-card-name { color: #fcd34d; text-shadow: 0 0 5px rgba(252, 211, 77, 0.5); }
    .deck-card-item.holo-deck-card.holo-legendary::before {
      background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.4), transparent);
    }
    @keyframes deckHoloShine {
      0% { left: -100%; }
      100% { left: 100%; }
    }
    /* === HOLO PREVIEW EFFECTS BY RARITY === */
    .preview-card.holo-preview .preview-card-glow {
      position: relative;
      overflow: visible;
    }
    .preview-card.holo-preview .preview-art {
      position: relative;
      overflow: hidden;
    }
    /* Common holo preview */
    .preview-card.holo-preview.holo-common .preview-card-glow {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(236, 72, 153, 0.3)) !important;
      border: 3px solid transparent !important;
    }
    .preview-card.holo-preview.holo-common .preview-card-glow::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      background: linear-gradient(45deg, #a855f7, #ec4899, #a855f7);
      background-size: 200% 200%;
      border-radius: 14px;
      z-index: -1;
      animation: holoCommonShift 4s ease-in-out infinite;
    }
    .preview-card.holo-preview.holo-common .preview-art::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 200%;
      animation: holoShine 3s ease-in-out infinite;
      pointer-events: none;
    }
    .preview-card.holo-preview.holo-common .preview-name { color: #e879f9; }
    
    /* Rare holo preview */
    .preview-card.holo-preview.holo-rare .preview-card-glow {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.3), rgba(59, 130, 246, 0.3)) !important;
      border: 3px solid transparent !important;
    }
    .preview-card.holo-preview.holo-rare .preview-card-glow::before {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      background: linear-gradient(45deg, #06b6d4, #3b82f6, #8b5cf6, #06b6d4);
      background-size: 300% 300%;
      border-radius: 14px;
      z-index: -1;
      animation: holoRareShift 2s linear infinite;
      filter: blur(2px);
    }
    .preview-card.holo-preview.holo-rare .preview-card-glow::after {
      content: '⚡';
      position: absolute;
      top: -10px;
      right: -10px;
      font-size: 24px;
      animation: holoRareSpark 1s ease-in-out infinite;
      z-index: 10;
    }
    .preview-card.holo-preview.holo-rare .preview-art::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(103, 232, 249, 0.5), transparent);
      animation: holoRareStreak 1.5s ease-in-out infinite;
    }
    .preview-card.holo-preview.holo-rare .preview-art::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(59, 130, 246, 0.2), transparent, rgba(139, 92, 246, 0.2), transparent);
      animation: holoRareSpin 4s linear infinite;
      pointer-events: none;
    }
    .preview-card.holo-preview.holo-rare .preview-name { color: #67e8f9; text-shadow: 0 0 10px rgba(103, 232, 249, 0.7); }
    @keyframes holoRareSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* Legendary holo preview - EPIC */
    .preview-card.holo-preview.holo-legendary .preview-card-glow {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.3), rgba(245, 158, 11, 0.3)) !important;
      border: 3px solid transparent !important;
    }
    .preview-card.holo-preview.holo-legendary .preview-card-glow::before {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      background: linear-gradient(45deg, 
        #ff0000, #ff4400, #ff8800, #ffcc00, #ffff00, 
        #88ff00, #00ff00, #00ff88, #00ffff, #0088ff, 
        #0000ff, #4400ff, #8800ff, #ff00ff, #ff0088, #ff0000);
      background-size: 600% 600%;
      border-radius: 16px;
      z-index: -1;
      animation: holoLegendaryRainbow 2s linear infinite;
      filter: blur(4px);
    }
    .preview-card.holo-preview.holo-legendary .preview-card-glow::after {
      content: '👑';
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      animation: holoLegendaryCrown 1s ease-in-out infinite;
      z-index: 10;
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.8));
    }
    .preview-card.holo-preview.holo-legendary .preview-art::after {
      content: '';
      position: absolute;
      top: -100%; left: -100%;
      width: 300%; height: 300%;
      background: conic-gradient(from 0deg at 50% 50%, 
        transparent 0deg, rgba(255,215,0,0.3) 60deg, transparent 120deg,
        rgba(255,140,0,0.3) 180deg, transparent 240deg,
        rgba(255,69,0,0.3) 300deg, transparent 360deg);
      animation: holoLegendarySpin 3s linear infinite;
      pointer-events: none;
    }
    .preview-card.holo-preview.holo-legendary .preview-art::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.5) 0%, transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(255,215,0,0.4) 0%, transparent 25%),
        radial-gradient(circle at 40% 80%, rgba(255,140,0,0.4) 0%, transparent 25%);
      animation: holoLegendarySparkle 1.5s ease-in-out infinite;
      z-index: 1;
    }
    .preview-card.holo-preview.holo-legendary .preview-name { 
      color: #fcd34d; 
      text-shadow: 0 0 10px rgba(252, 211, 77, 0.8), 0 0 20px rgba(251, 146, 60, 0.6);
      animation: holoLegendaryText 1s ease-in-out infinite;
    }
    @keyframes holoLegendarySparkle {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes holoLegendaryText {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    
    .deck-empty { text-align: center; padding: 30px 15px; color: #64748b; }
    .deck-empty-icon { font-size: 36px; margin-bottom: 8px; opacity: 0.5; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(30, 30, 60, 0.95); border: 2px solid rgba(16, 185, 129, 0.6); border-radius: 10px; padding: 12px 20px; color: #e2e8f0; font-size: 13px; display: flex; align-items: center; gap: 8px; z-index: 1000; opacity: 0; transition: all 0.3s; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { border-color: rgba(239, 68, 68, 0.6); }
    .login-prompt { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 30px; }
    .login-prompt-icon { font-size: 48px; margin-bottom: 15px; }

        const holoClass = isHolo ? ' holo-deck-card holo-' + rarity : '';
        const holoPrefix = isHolo ? '✨ ' : '';
        return '<div class="deck-card-item' + holoClass + ' ' + (key === selectedCardKey ? 'selected' : '') + '" onclick="selectCard(\'' + key + '\')"><div class="deck-card-art" style="background-image:url(\'' + artUrl + '\'); background-size: contain; background-position: center; background-repeat: no-repeat;"></div><div class="deck-card-info"><div class="deck-card-name">' + holoPrefix + card.name + '</div><div class="deck-card-type">' + (card.type === 'spell' ? 'Spell' : 'Unit') + '</div></div><div class="deck-card-cost">' + card.cost + '</div><div class="deck-card-qty">×' + qty + '</div></div>';
      }).join('');
    }
    function updateEnergyCurve() {
      const counts = [0, 0, 0, 0, 0, 0];
      currentDeck.forEach(function(k) { const c = CARD_DATA[k]; if (c) { const idx = Math.min(c.cost, 6) - 1; counts[idx >= 0 ? idx : 5]++; } });
      const max = Math.max.apply(null, counts.concat([1]));
      for (var i = 0; i < 6; i++) {
        var barEl = document.getElementById('bar' + (i + 1));
        var countEl = document.getElementById('count' + (i + 1));
        if (barEl) barEl.style.height = (counts[i] / max) * 100 + '%';
        if (countEl) countEl.textContent = counts[i];
      }
    }
    function updateSaveButton() { const count = currentDeck.length; saveBtn.disabled = !(count >= 25 && count <= 35 && currentDeckName.trim() && hasChanges); }
    function getMaxCopies(card) {
      // Deck limits based on rarity
      const rarity = card.rarity || 'common';
      if (rarity === 'legendary') return 1;
      if (rarity === 'rare') return 2;
      return 3;
    }
    function addToDeck(key) {
      // Check if this is a holo card
      const isHolo = key.endsWith('_holo');
      const baseKey = isHolo ? key.replace('_holo', '') : key;
      
      const card = CARD_DATA[baseKey]; if (!card) return;
      const maxCopies = getMaxCopies(card);
      const owned = isHolo ? (holoCollection[baseKey] || 0) : (userCollection[baseKey] || 0);
      const inDeck = currentDeck.filter(function(k) { return k === key; }).length;
      
      // Also count total of this card (regular + holo) toward the limit
      const totalInDeck = currentDeck.filter(function(k) { 
        return k === baseKey || k === baseKey + '_holo'; 
      }).length;
      
      if (owned === 0) { showToast("You don't own this card" + (isHolo ? ' (holo)' : ''), true); return; }
      if (totalInDeck >= maxCopies) { 
        const rarity = card.rarity || 'common';
        const rarityLabel = rarity === 'legendary' ? '(Legendary)' : rarity === 'rare' ? '(Rare)' : '';
        showToast('Max ' + maxCopies + ' total in deck ' + rarityLabel, true); 
        return; 
      }
      if (inDeck >= owned) { showToast('No more ' + (isHolo ? 'holo ' : '') + 'copies available (own ' + owned + ')', true); return; }
      if (currentDeck.length >= 35) { showToast('Deck full (35 max)', true); return; }
      currentDeck.push(key); hasChanges = true;
      renderCollection(); renderDeck(); updateEnergyCurve(); updateSaveButton(); renderCardPreview();
    }
    function removeFromDeck(key) {
      const idx = currentDeck.indexOf(key);
      if (idx > -1) { currentDeck.splice(idx, 1); hasChanges = true; renderCollection(); renderDeck(); updateEnergyCurve(); updateSaveButton(); renderCardPreview(); }
    }
    function clearDeck() { if (currentDeck.length === 0) return; if (confirm('Clear all cards?')) { currentDeck = []; hasChanges = true; renderCollection(); renderDeck(); updateEnergyCurve(); updateSaveButton(); renderCardPreview(); } }
    function resetFilters() { searchInput.value = ''; ownedFilter.value = 'all'; archetypeFilter.value = 'all'; typeFilter.value = 'all'; costFilter.value = 'all'; rarityFilter.value = 'all'; holoFilter.value = 'all'; renderCollection(); }
    
    async function fixCollection() {
      if (!currentUser || currentUser.id === 'admin') { showToast('Cannot fix admin account', true); return; }
      if (!confirm('This will ensure you have 3 copies of each medieval card. Continue?')) return;
      fixCollectionBtn.disabled = true;
      fixCollectionBtn.textContent = '🔧 Fixing...';
      try {
        const res = await fetch('/api/fixCollection', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: currentUser.id }) });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('gridCardUser', JSON.stringify(data.user));
          currentUser = data.user;
          userCollection = currentUser.cardCollection || {};
          holoCollection = currentUser.holoCollection || {};
          renderCollection();
          renderDeck();
          renderCardPreview();
          const total = Object.keys(CARD_DATA).length;
          const owned = Object.keys(CARD_DATA).filter(function(k) { return (userCollection[k] || 0) > 0; }).length;
          collectionCount.textContent = owned + '/' + total + ' owned';
          showToast('Collection fixed! You now have 3 of each medieval card.');
        } else { throw new Error(data.error || 'Failed'); }
      } catch (err) { showToast('Fix failed: ' + err.message, true); }
      fixCollectionBtn.disabled = false;
      fixCollectionBtn.textContent = '🔧 Fix Collection';
    }
    
    async function saveDeck() {
      if (currentDeck.length < 25 || currentDeck.length > 35) { showToast('Need 25-35 cards', true); return; }
      if (!currentDeckName.trim()) { showToast('Enter deck name', true); return; }
      if (!currentUser || currentUser.id === 'admin') { showToast('Cannot save', true); return; }
      saveBtn.disabled = true; saveBtn.textContent = '💾 Saving...';
      try {
        const res = await fetch('/api/saveDeck', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ 
          userId: currentUser.id, 
          deckType: currentDeckType, 
          deckName: currentDeckName.trim(), 
          cards: currentDeck,
          music: currentMusic,
          background: currentBackground
        }) });
        const data = await res.json();
        if (data.success) {
          if (data.user) { localStorage.setItem('gridCardUser', JSON.stringify(data.user)); currentUser = data.user; }
          hasChanges = false; updateSaveButton();
          const opt = deckSelect.querySelector('option[value="' + currentDeckType + '"]');
          if (opt) opt.textContent = currentDeckName;
          showToast('Deck saved!');
        } else { throw new Error(data.error || 'Failed'); }
      } catch (err) { showToast('Save failed: ' + err.message, true); }
      saveBtn.textContent = '💾 Save Deck'; updateSaveButton();
    }
    function showToast(msg, isError) {
      toastIcon.textContent = isError ? '❌' : '✅';
      toastMessage.textContent = msg;
      toast.className = 'toast' + (isError ? ' error' : '');
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }
    init();
  </script>
</body>
</html>
