<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collections Gallery - Grid Card Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: #e2e8f0; }
    
    /* Background orbs */
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.3; pointer-events: none; z-index: 0; }
    .bg-orb-1 { width: 400px; height: 400px; background: #8b5cf6; top: -100px; left: -100px; }
    .bg-orb-2 { width: 300px; height: 300px; background: #6d28d9; bottom: -50px; right: -50px; }
    
    .page-container { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: rgba(20, 20, 40, 0.9); border-bottom: 2px solid rgba(138, 43, 226, 0.4); }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .back-btn { padding: 8px 16px; background: rgba(138, 43, 226, 0.3); border: 1px solid rgba(138, 43, 226, 0.5); border-radius: 8px; color: #e2e8f0; text-decoration: none; font-size: 13px; transition: all 0.2s; }
    .back-btn:hover { background: rgba(138, 43, 226, 0.5); }
    .page-title { font-family: 'Cinzel', serif; font-size: 24px; color: #fbbf24; text-shadow: 0 0 20px rgba(251, 191, 36, 0.3); }
    
    /* Tab Navigation */
    .tab-nav { display: flex; gap: 5px; padding: 15px 25px; background: rgba(20, 20, 40, 0.5); border-bottom: 1px solid rgba(138, 43, 226, 0.3); flex-wrap: wrap; }
    .tab-btn { padding: 10px 20px; background: rgba(30, 30, 60, 0.5); border: 2px solid rgba(138, 43, 226, 0.3); border-radius: 8px; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .tab-btn:hover { background: rgba(138, 43, 226, 0.2); color: #e2e8f0; }
    .tab-btn.active { background: linear-gradient(135deg, rgba(138, 43, 226, 0.4), rgba(168, 85, 247, 0.4)); border-color: #a855f7; color: #fbbf24; }
    
    /* Main content */
    .main-content { flex: 1; padding: 20px 25px; overflow-y: auto; }
    
    /* Gallery Grid */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .gallery-grid.backgrounds { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .gallery-grid.music { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    
    /* Card Item */
    .gallery-item { position: relative; background: linear-gradient(145deg, rgba(30, 30, 60, 0.9), rgba(20, 20, 40, 0.9)); border: 2px solid rgba(138, 43, 226, 0.4); border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.3s; }
    .gallery-item:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(138, 43, 226, 0.3); }
    .gallery-item.locked { opacity: 0.4; filter: grayscale(0.7); cursor: not-allowed; }
    .gallery-item.locked:hover { transform: none; box-shadow: none; }
    
    /* Card art display */
    .gallery-art { width: 100%; aspect-ratio: 3/4; background-size: cover; background-position: center top; background-color: rgba(30, 30, 60, 0.5); }
    .gallery-item.holo .gallery-art { position: relative; }
    .gallery-item.holo::before { content: ''; position: absolute; inset: -2px; background: linear-gradient(45deg, #ff0000, #ff8000, #ffff00, #00ff00, #00ffff, #0080ff, #8000ff, #ff00ff, #ff0000); background-size: 400% 400%; border-radius: 14px; z-index: -1; animation: holoShift 3s linear infinite; }
    @keyframes holoShift { 0% { background-position: 0% 50%; } 100% { background-position: 400% 50%; } }
    
    /* Background art display */
    .gallery-art.bg-art { aspect-ratio: 16/9; background-size: cover; background-position: center; }
    
    /* Mat art display */
    .gallery-art.mat-art { aspect-ratio: 2/1; background-size: cover; background-position: center; }
    
    .gallery-info { padding: 12px; background: linear-gradient(to top, rgba(15, 15, 35, 1), rgba(15, 15, 35, 0.9)); }
    .gallery-name { font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700; color: #e2e8f0; text-align: center; margin-bottom: 4px; }
    .gallery-subtitle { font-size: 10px; color: #64748b; text-align: center; }
    .gallery-holo-label { font-size: 9px; color: #e879f9; text-align: center; margin-top: 2px; }
    
    /* Rarity borders */
    .gallery-item.rarity-common { border-color: rgba(148, 163, 184, 0.6); }
    .gallery-item.rarity-rare { border-color: rgba(59, 130, 246, 0.7); box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }
    .gallery-item.rarity-legendary { border-color: rgba(251, 191, 36, 0.7); box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
    
    /* Locked overlay */
    .locked-overlay { position: absolute; inset: 0; background: rgba(20, 20, 40, 0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .locked-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.6; }
    .locked-text { font-size: 11px; color: #64748b; text-align: center; padding: 0 10px; }
    
    /* Music player */
    .music-item { display: flex; align-items: center; gap: 15px; padding: 15px; }
    .music-icon { font-size: 36px; }
    .music-info { flex: 1; }
    .music-title { font-family: 'Cinzel', serif; font-size: 16px; color: #e2e8f0; margin-bottom: 4px; }
    .music-archetype { font-size: 12px; color: #64748b; }
    .music-controls { display: flex; gap: 10px; }
    .music-btn { padding: 8px 16px; background: linear-gradient(135deg, #8b5cf6, #6d28d9); border: none; border-radius: 8px; color: white; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .music-btn:hover { transform: scale(1.05); }
    .music-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .music-btn.playing { background: linear-gradient(135deg, #10b981, #059669); }
    
    /* Archetype filter */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-label { font-size: 13px; color: #94a3b8; }
    .filter-select { padding: 8px 12px; background: rgba(20, 20, 40, 0.8); border: 1px solid rgba(138, 43, 226, 0.4); border-radius: 6px; color: #e2e8f0; font-size: 12px; cursor: pointer; }
    .filter-select:focus { outline: none; border-color: #a855f7; }
    
    /* Lightbox modal */
    .lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 40px; }
    .lightbox.active { display: flex; }
    .lightbox-content { max-width: 90%; max-height: 90%; position: relative; }
    .lightbox-image { max-width: 100%; max-height: 80vh; border-radius: 12px; box-shadow: 0 0 50px rgba(138, 43, 226, 0.5); }
    .lightbox-info { text-align: center; margin-top: 20px; }
    .lightbox-title { font-family: 'Cinzel', serif; font-size: 24px; color: #fbbf24; margin-bottom: 8px; }
    .lightbox-subtitle { font-size: 14px; color: #94a3b8; }
    .lightbox-close { position: absolute; top: -40px; right: 0; background: none; border: none; color: #e2e8f0; font-size: 32px; cursor: pointer; }
    .lightbox-close:hover { color: #fbbf24; }
    
    /* Stats bar */
    .stats-bar { display: flex; gap: 20px; padding: 10px 25px; background: rgba(20, 20, 40, 0.5); border-bottom: 1px solid rgba(138, 43, 226, 0.2); font-size: 12px; color: #94a3b8; }
    .stat-item { display: flex; align-items: center; gap: 5px; }
    .stat-value { color: #fbbf24; font-weight: 600; }
    
    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
    .empty-icon { font-size: 48px; margin-bottom: 15px; opacity: 0.5; }
    .empty-text { font-size: 14px; }
    
    /* Achievements styles - Grid of achievement tiles */
    .gallery-grid.achievements { 
      display: flex;
      flex-direction: column;
      gap: 25px;
      padding: 20px;
    }
    
    .achievements-summary {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px;
      background: linear-gradient(145deg, rgba(30, 30, 60, 0.6), rgba(20, 20, 40, 0.7));
      border-radius: 12px;
      border: 1px solid rgba(100, 116, 139, 0.3);
    }
    .summary-stat {
      text-align: center;
    }
    .summary-value {
      font-size: 32px;
      font-weight: 700;
      color: #fbbf24;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
    }
    .summary-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 15px;
    }
    
    .achievement-tile {
      position: relative;
      aspect-ratio: 1;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(20, 30, 45, 0.9));
      border: 2px solid rgba(100, 116, 139, 0.4);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      overflow: hidden;
    }
    .achievement-tile:hover {
      transform: translateY(-3px);
      border-color: rgba(148, 163, 184, 0.6);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    
    /* Unlocked achievement */
    .achievement-tile.unlocked {
      background: linear-gradient(145deg, rgba(34, 197, 94, 0.2), rgba(20, 83, 45, 0.3));
      border-color: rgba(34, 197, 94, 0.6);
    }
    .achievement-tile.unlocked:hover {
      border-color: rgba(34, 197, 94, 0.9);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.3);
    }
    
    /* Mystery achievement (has reward) */
    .achievement-tile.mystery {
      background: linear-gradient(145deg, rgba(147, 51, 234, 0.2), rgba(88, 28, 135, 0.3));
      border-color: rgba(167, 139, 250, 0.5);
    }
    .achievement-tile.mystery:hover {
      border-color: rgba(167, 139, 250, 0.8);
      box-shadow: 0 8px 25px rgba(147, 51, 234, 0.3);
    }
    .achievement-tile.mystery.unlocked {
      background: linear-gradient(145deg, rgba(251, 191, 36, 0.2), rgba(180, 130, 20, 0.3));
      border-color: rgba(251, 191, 36, 0.7);
    }
    .achievement-tile.mystery.unlocked:hover {
      border-color: rgba(251, 191, 36, 1);
      box-shadow: 0 8px 25px rgba(251, 191, 36, 0.4);
    }
    
    .achievement-tile-icon {
      font-size: 36px;
      margin-bottom: 5px;
    }
    .achievement-tile.locked .achievement-tile-icon {
      filter: grayscale(0.7) brightness(0.7);
    }
    
    .achievement-tile-name {
      font-size: 10px;
      color: #e2e8f0;
      text-align: center;
      padding: 0 5px;
      line-height: 1.2;
      max-height: 24px;
      overflow: hidden;
    }
    .achievement-tile.mystery:not(.unlocked) .achievement-tile-name {
      color: #a78bfa;
    }
    
    /* Progress bar */
    .achievement-progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: rgba(0, 0, 0, 0.4);
    }
    .achievement-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      transition: width 0.3s ease;
    }
    .achievement-tile.unlocked .achievement-progress-fill {
      background: linear-gradient(90deg, #22c55e, #4ade80);
      width: 100% !important;
    }
    .achievement-tile.mystery .achievement-progress-fill {
      background: linear-gradient(90deg, #8b5cf6, #a78bfa);
    }
    .achievement-tile.mystery.unlocked .achievement-progress-fill {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
    }
    
    /* Checkmark for completed */
    .achievement-complete-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 20px;
      height: 20px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      box-shadow: 0 2px 6px rgba(34, 197, 94, 0.5);
    }
    .achievement-tile.mystery.unlocked .achievement-complete-badge {
      background: #f59e0b;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.5);
    }
    
    /* Reward badge */
    .achievement-reward-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      font-size: 14px;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    }
    
    /* Tooltip */
    .achievement-tooltip {
      position: fixed;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 10px;
      padding: 12px 16px;
      max-width: 250px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .achievement-tooltip.visible {
      opacity: 1;
    }
    .tooltip-title {
      font-weight: 600;
      color: #f1f5f9;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .tooltip-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .tooltip-progress {
      font-size: 11px;
      color: #60a5fa;
      margin-top: 6px;
    }
    .tooltip-reward {
      font-size: 11px;
      color: #fbbf24;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tooltip-mystery {
      font-size: 12px;
      color: #a78bfa;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  
  <div class="page-container">
    <header class="header">
      <div class="header-left">
        <a href="/home.html" class="back-btn">← Back</a>
        <h1 class="page-title">🖼️ Collections Gallery</h1>
      </div>
    </header>
    
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="cards">🃏 Cards</button>
      <button class="tab-btn" data-tab="backgrounds">🖼️ Backgrounds</button>
      <button class="tab-btn" data-tab="mats">🎴 Game Mats</button>
      <button class="tab-btn" data-tab="music">🎵 Music</button>
      <button class="tab-btn" data-tab="achievements">🏆 Achievements</button>
    </nav>
    
    <div class="stats-bar">
      <div class="stat-item">Cards: <span class="stat-value" id="cardsStat">0/0</span></div>
      <div class="stat-item">Holo: <span class="stat-value" id="holoStat">0</span></div>
      <div class="stat-item">Backgrounds: <span class="stat-value" id="bgStat">0/0</span></div>
      <div class="stat-item">Music: <span class="stat-value" id="musicStat">0/0</span></div>
    </div>
    
    <main class="main-content">
      <div class="filter-bar" id="filterBar">
        <span class="filter-label">Filter:</span>
        <select class="filter-select" id="archetypeFilter">
          <option value="all">All Archetypes</option>
          <option value="medieval">Medieval</option>
          <option value="void-alien">Void Alien</option>
          <option value="western-skeleton">Western Skeleton</option>
          <option value="crimson-court">Crimson Court</option>
          <option value="jeweled-court">Jeweled Court</option>
          <option value="elunes-chosen">Elune's Chosen</option>
          <option value="dragon-wizard">Dragon Wizard</option>

        <select class="filter-select" id="rarityFilter">
          <option value="all">All Rarities</option>
          <option value="common">Common</option>
          <option value="rare">Rare</option>
          <option value="legendary">Legendary</option>
        </select>
      </div>
      
      <div class="gallery-grid" id="galleryGrid"></div>
    </main>
  </div>
  
  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose">&times;</button>
      <img class="lightbox-image" id="lightboxImage" src="" alt="">
      <div class="lightbox-info">
        <div class="lightbox-title" id="lightboxTitle"></div>
        <div class="lightbox-subtitle" id="lightboxSubtitle"></div>
      </div>
    </div>
  </div>
  
  <audio id="audioPlayer"></audio>

    };
    
    let currentUser = null;
    let currentTab = 'cards';
    let currentlyPlaying = null;
    const audioPlayer = document.getElementById('audioPlayer');
    
    // DOM elements
    const galleryGrid = document.getElementById('galleryGrid');
    const archetypeFilter = document.getElementById('archetypeFilter');
    const rarityFilter = document.getElementById('rarityFilter');
    const filterBar = document.getElementById('filterBar');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxTitle = document.getElementById('lightboxTitle');
    const lightboxSubtitle = document.getElementById('lightboxSubtitle');
    const lightboxClose = document.getElementById('lightboxClose');
    
    // Initialize
    function init() {
      const storedUser = localStorage.getItem('gridCardUser');
      if (storedUser) {
        try {
          currentUser = JSON.parse(storedUser);
          updateStats();
          renderGallery();
        } catch(e) {
          window.location.href = '/home.html';
        }
      } else {
        window.location.href = '/home.html';
      }
      
      // Tab buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTab = btn.dataset.tab;
          updateFilters();
          renderGallery();
        });
      });
      
      // Filters
      archetypeFilter.addEventListener('change', renderGallery);
      rarityFilter.addEventListener('change', renderGallery);
      
      // Lightbox
      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });
    }
    
    function updateFilters() {
      // Show/hide filters based on tab
      if (currentTab === 'cards' || currentTab === 'holo') {
        filterBar.style.display = 'flex';
        rarityFilter.style.display = 'block';
      } else if (currentTab === 'backgrounds' || currentTab === 'mats' || currentTab === 'music' || currentTab === 'achievements') {
        filterBar.style.display = 'none';
      }
    }
    
    function updateStats() {
      const cardCollection = currentUser.cardCollection || {};
      const holoCollection = currentUser.holoCollection || {};
      const unlockedDecks = currentUser.unlockedDecks || ['medieval'];
      const unlockedMusic = currentUser.unlockedMusic || ['medieval'];
      const unlockedBackgrounds = currentUser.unlockedBackgrounds || ['medieval'];
      
      // Count owned cards
      const totalCards = Object.keys(CARD_DATA).length;
      const ownedCards = Object.keys(CARD_DATA).filter(k => (cardCollection[k] || 0) > 0).length;
      document.getElementById('cardsStat').textContent = `${ownedCards}/${totalCards}`;
      
      // Count holo cards
      const holoCount = Object.values(holoCollection).reduce((sum, n) => sum + n, 0);
      document.getElementById('holoStat').textContent = holoCount;
      
      // Count backgrounds
      const totalBgs = Object.keys(ARCHETYPES).length;
      const ownedBgs = unlockedBackgrounds.length;
      document.getElementById('bgStat').textContent = `${ownedBgs}/${totalBgs}`;
      
      // Count music
      const totalMusic = Object.keys(ARCHETYPES).length;
      const ownedMusic = unlockedMusic.length;
      document.getElementById('musicStat').textContent = `${ownedMusic}/${totalMusic}`;
    }
    
    function isCardUnlocked(cardKey) {
      const card = CARD_DATA[cardKey];
      if (!card) return false;
      if (card.archetype === 'medieval') return true;
      const unlockedDecks = currentUser.unlockedDecks || ['medieval'];
      return unlockedDecks.includes(card.archetype);
    }
    
    function renderGallery() {
      const archFilter = archetypeFilter.value;
      const rarFilter = rarityFilter.value;
      
      if (currentTab === 'cards') {
        renderCards(archFilter, rarFilter, false);
      } else if (currentTab === 'holo') {
        renderCards(archFilter, rarFilter, true);
      } else if (currentTab === 'backgrounds') {
        renderBackgrounds();
      } else if (currentTab === 'mats') {
        renderMats();
      } else if (currentTab === 'music') {
        renderMusic();
      } else if (currentTab === 'achievements') {
        renderAchievements();
      }
    }
    
    // Helper to escape strings for use in onclick handlers
    function escapeForAttr(str) {
      return str.replace(/'/g, "&#39;").replace(/"/g, '&quot;');
    }
    
    function renderCards(archFilter, rarFilter, holoOnly) {
      const cardCollection = currentUser.cardCollection || {};
      const holoCollection = currentUser.holoCollection || {};
      
      let cards = Object.entries(CARD_DATA).filter(([key, card]) => {
        // Must be unlocked (archetype unlocked)
        if (!isCardUnlocked(key)) return false;
        
        // Apply filters
        if (archFilter !== 'all' && card.archetype !== archFilter) return false;
        if (rarFilter !== 'all' && (card.rarity || 'common') !== rarFilter) return false;
        
        if (holoOnly) {
          // Only show cards that have holo versions owned
          return (holoCollection[key] || 0) > 0;
        } else {
          // Only show cards that are owned (regular collection)
          return (cardCollection[key] || 0) > 0;
        }
      });
      
      // Sort by archetype, then cost
      cards.sort((a, b) => {
        const archOrder = { 'medieval': 0, 'void-alien': 1, 'western-skeleton': 2, 'crimson-court': 3, 'jeweled-court': 4, 'elunes-chosen': 5, 'dragon-wizard': 6 };
        if (a[1].archetype !== b[1].archetype) return (archOrder[a[1].archetype] || 99) - (archOrder[b[1].archetype] || 99);
        return a[1].cost - b[1].cost;
      });
      
      if (cards.length === 0) {
        galleryGrid.innerHTML = `<div class="empty-state"><div class="empty-icon">${holoOnly ? '✨' : '🃏'}</div><div class="empty-text">${holoOnly ? 'No holo cards collected yet. Win Challenge mode to get holo cards!' : 'No cards collected yet. Win battles to earn cards!'}</div></div>`;
        galleryGrid.className = 'gallery-grid';
        return;
      }
      
      galleryGrid.className = 'gallery-grid';
      galleryGrid.innerHTML = cards.map(([key, card]) => {
        const owned = holoOnly ? (holoCollection[key] || 0) : (cardCollection[key] || 0);
        const rarity = card.rarity || 'common';
        const artUrl = encodeURI(card.art || '');
        const holoClass = holoOnly ? ' holo' : '';
        const cardName = escapeForAttr(card.name);
        const archName = escapeForAttr(ARCHETYPES[card.archetype]?.name || card.archetype);
        const subtitle = `${archName} • ${rarity.charAt(0).toUpperCase() + rarity.slice(1)}${holoOnly ? ' • ✨ HOLO' : ''}`;
        
        return `
          <div class="gallery-item rarity-${rarity}${holoClass}" onclick="openLightbox('${artUrl}', '${cardName}', '${escapeForAttr(subtitle)}')">
            <div class="gallery-art" style="background-image: url('${artUrl}')"></div>
            <div class="gallery-info">
              <div class="gallery-name">${holoOnly ? '✨ ' : ''}${card.name}</div>
              <div class="gallery-subtitle">${rarity.charAt(0).toUpperCase() + rarity.slice(1)} • ${card.cost}⚡</div>
              ${holoOnly ? `<div class="gallery-holo-label">Owned: ${owned}</div>` : `<div class="gallery-subtitle" style="color: #fbbf24;">Owned: ${owned}</div>`}
            </div>
          </div>
        `;
      }).join('');
    }
    
    function renderBackgrounds() {
      const unlockedBackgrounds = currentUser.unlockedBackgrounds || ['medieval'];
      
      // Only show unlocked backgrounds
      const unlocked = Object.entries(ARCHETYPES).filter(([key]) => unlockedBackgrounds.includes(key));
      
      if (unlocked.length === 0) {
        galleryGrid.innerHTML = `<div class="empty-state"><div class="empty-icon">🖼️</div><div class="empty-text">No backgrounds unlocked yet. Defeat bosses to unlock!</div></div>`;
        galleryGrid.className = 'gallery-grid backgrounds';
        return;
      }
      
      galleryGrid.className = 'gallery-grid backgrounds';
      galleryGrid.innerHTML = unlocked.map(([key, arch]) => {
        const archName = escapeForAttr(arch.name);
        return `
          <div class="gallery-item" onclick="openLightbox('${arch.bgImage}', '${archName}', 'Background')">
            <div class="gallery-art bg-art" style="background-image: url('${arch.bgImage}')"></div>

            </div>
          </div>

      const userAchievements = currentUser?.achievements || {};

      // Count achievements
      const totalAchievements = Object.keys(ACHIEVEMENTS).length;
      const unlockedCount = Object.keys(userAchievements).filter(k => userAchievements[k] === true).length;
      
      // Helper to get progress for threshold achievements
      function getProgress(achievementId, achievement) {
        if (!achievement.threshold) return { current: 0, max: 1 };
        
        const statMap = {
          wins: userStats.gamesWon || 0,
          games: userStats.gamesPlayed || 0,
          kills: userStats.totalKills || 0,
          damage: userStats.totalDamage || 0,
          cards: userStats.cardsPlayed || 0,
          pvp: userStats.pvpWins || 0,
          challenge: userStats.challengeBossesBeaten || 0
        };
        
        let current = 0;
        if (achievementId.startsWith('win_streak')) {
          current = userStats.bestWinStreak || 0;
        } else if (achievementId.startsWith('holo')) {
          current = currentUser?.holoCollection ? Object.values(currentUser.holoCollection).reduce((a, b) => a + b, 0) : 0;
        } else if (achievementId.startsWith('collect')) {
          current = currentUser?.cardCollection ? Object.keys(currentUser.cardCollection).length : 0;
        } else {
          current = statMap[achievement.category] || 0;
        }
        
        return { current: Math.min(current, achievement.threshold), max: achievement.threshold };

            tooltipHtml = `
              <div class="tooltip-title">${name}</div>
              <div class="tooltip-desc">${desc}</div>
              ${!isUnlocked ? `<div class="tooltip-progress">Progress: ${progress}</div>` : ''}
              ${reward ? `<div class="tooltip-reward">🎁 ${reward}</div>` : ''}
            `;
          }
          
          tooltip.innerHTML = tooltipHtml;
          tooltip.classList.add('visible');
        });
        
        tile.addEventListener('mousemove', (e) => {
          tooltip.style.left = (e.clientX + 15) + 'px';
          tooltip.style.top = (e.clientY + 15) + 'px';
        });
        
        tile.addEventListener('mouseleave', () => {
          tooltip.classList.remove('visible');
        });
      });
    }
    
    function toggleMusic(key) {
      const arch = ARCHETYPES[key];
      if (!arch) return;
      
      if (currentlyPlaying === key) {
        // Stop
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        currentlyPlaying = null;
      } else {
        // Play
        audioPlayer.src = arch.musicFile;
        audioPlayer.play().catch(e => console.log('Audio play failed:', e));
        currentlyPlaying = key;
      }
      
      renderMusic();
    }
    
    // Audio ended handler
    audioPlayer.addEventListener('ended', () => {
      currentlyPlaying = null;
      if (currentTab === 'music') renderMusic();
    });
    
    function openLightbox(imageUrl, title, subtitle) {
      lightboxImage.src = imageUrl;
      lightboxTitle.textContent = title;
      lightboxSubtitle.textContent = subtitle;
      lightbox.classList.add('active');
    }
    
    function closeLightbox() {
      lightbox.classList.remove('active');
    }
    
    // Keyboard shortcut to close lightbox
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
    
    // Init on load
    init();
  </script>
</body>
</html>
