<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Playtest - Grid Card Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, Arial;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e2e8f0;
      overflow-x: hidden;
    }

    /* Main Layout */
    #mainContainer {
      display: flex;
      min-height: 100vh;
    }

    /* Card Library Panel */
    #playtestPanel {
      width: 300px;
      background: rgba(20, 20, 40, 0.98);
      border-right: 2px solid rgba(138, 43, 226, 0.5);
      padding: 15px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }

    #playtestPanel h3 {
      margin: 0 0 12px 0;
      color: #a78bfa;
      font-size: 16px;
      font-family: 'Cinzel', serif;
      border-bottom: 1px solid rgba(138, 43, 226, 0.3);
      padding-bottom: 10px;
    }

    #cardSearch {
      width: 100%;
      padding: 8px 12px;
      background: rgba(30, 30, 60, 0.8);
      border: 1px solid rgba(138, 43, 226, 0.3);
      border-radius: 6px;
      color: #e2e8f0;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }

    .filter-btn {
      padding: 5px 10px;
      font-size: 11px;
      background: rgba(30, 30, 60, 0.8);
      border: 1px solid rgba(138, 43, 226, 0.3);
      border-radius: 4px;
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: rgba(138, 43, 226, 0.4);
      border-color: #a78bfa;
    }

    #spawnSideSelector {
      display: flex;
      gap: 20px;
      margin: 12px 0;
      padding: 10px;
      background: rgba(30, 30, 60, 0.5);
      border-radius: 8px;
      justify-content: center;
    }

    #spawnSideSelector label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    #spawnSideSelector .gold { color: #fbbf24; }
    #spawnSideSelector .silver { color: #94a3b8; }

    #cardLibrary {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .library-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(30, 30, 60, 0.8);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .library-card:hover {
      background: rgba(138, 43, 226, 0.3);
      transform: translateX(4px);
    }

    .library-card.selected {
      background: rgba(138, 43, 226, 0.5);
      border-color: #a78bfa;
    }

    .library-card .cost {
      background: #3b82f6;
      color: white;
      min-width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
    }

    .library-card .card-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .library-card .stats {
      color: #94a3b8;
      font-size: 11px;
      white-space: nowrap;
    }

    .library-card .stats .atk { color: #f87171; }
    .library-card .stats .hp { color: #4ade80; }

    #selectedCardPreview {
      padding: 12px;
      background: rgba(30, 30, 60, 0.8);
      border-radius: 8px;
      border: 1px solid rgba(138, 43, 226, 0.3);
      margin-bottom: 10px;
      display: none;
    }

    #selectedCardPreview .name {
      font-weight: 700;
      color: #fbbf24;
      font-size: 14px;
      margin-bottom: 4px;
    }

    #selectedCardPreview .card-stats {
      color: #e2e8f0;
      font-size: 12px;
      margin-bottom: 4px;
    }

    #selectedCardPreview .effect {
      color: #94a3b8;
      font-style: italic;
      font-size: 11px;
    }

    .instructions {
      font-size: 10px;
      color: #64748b;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      line-height: 1.5;
    }

    .instructions strong { color: #a78bfa; }

    /* Game Area */
    #gameArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 15px;
    }

    /* Controls Row */
    #controlsRow {
      display: flex;
      gap: 15px;
      align-items: center;
      background: rgba(30, 30, 60, 0.8);
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid rgba(138, 43, 226, 0.3);
    }

    #turnLabel {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 18px;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    #turnLabel.silver { color: #94a3b8; text-shadow: 0 0 10px rgba(148, 163, 184, 0.5); }

    #energyLabel {
      color: #60a5fa;
      font-weight: 700;
      font-size: 14px;
    }

    button {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      background: linear-gradient(145deg, rgba(138, 43, 226, 0.6), rgba(88, 28, 135, 0.8));
      border: 1px solid rgba(138, 43, 226, 0.6);
      border-radius: 6px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: linear-gradient(145deg, rgba(168, 85, 247, 0.8), rgba(126, 34, 206, 0.9));
      transform: translateY(-1px);
    }

    /* Heart Display */
    .heartDisplay {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      background: rgba(30, 30, 60, 0.8);
      border-radius: 8px;
      font-weight: 700;
    }

    .heartDisplay.gold { border: 2px solid rgba(251, 191, 36, 0.5); color: #fbbf24; }
    .heartDisplay.silver { border: 2px solid rgba(148, 163, 184, 0.5); color: #94a3b8; }

    /* Board */
    #boardContainer {
      background: rgba(30, 30, 60, 0.6);
      border: 3px solid rgba(138, 43, 226, 0.4);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    #board {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .row {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .row-label {
      width: 24px;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      color: #64748b;
    }

    .cell {
      width: 90px;
      height: 100px;
      background: rgba(40, 40, 80, 0.6);
      border: 2px solid rgba(100, 116, 139, 0.3);
      border-radius: 8px;
      position: relative;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cell:hover {
      border-color: rgba(138, 43, 226, 0.6);
      background: rgba(60, 60, 100, 0.6);
    }

    .cell.gold-row {
      background: linear-gradient(180deg, rgba(251, 191, 36, 0.15) 0%, rgba(40, 40, 80, 0.6) 100%);
      border-color: rgba(251, 191, 36, 0.3);
    }

    .cell.silver-row {
      background: linear-gradient(0deg, rgba(148, 163, 184, 0.15) 0%, rgba(40, 40, 80, 0.6) 100%);
      border-color: rgba(148, 163, 184, 0.3);
    }

    .row-hp {
      position: absolute;
      top: 2px;
      right: 2px;
      font-size: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 5px;
      border-radius: 4px;
      color: #94a3b8;
    }

    /* Units */
    .unit {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
    }

    .unit.gold {
      background: linear-gradient(145deg, rgba(251, 191, 36, 0.3), rgba(217, 119, 6, 0.2));
      border: 2px solid rgba(251, 191, 36, 0.6);
    }

    .unit.silver {
      background: linear-gradient(145deg, rgba(148, 163, 184, 0.3), rgba(100, 116, 139, 0.2));
      border: 2px solid rgba(148, 163, 184, 0.6);
    }

    .unit-art {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: cover;
      margin-bottom: 2px;
    }

    .unit-name {
      font-size: 9px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80px;
      color: #e2e8f0;
    }

    .unit-stats {
      font-size: 11px;
      font-weight: 700;
      display: flex;
      gap: 6px;
    }

    .unit-stats .atk { color: #f87171; }
    .unit-stats .hp { color: #4ade80; }

    /* Log Panel */
    #logPanel {
      position: fixed;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 250px;
      max-height: 60vh;
      background: rgba(20, 20, 40, 0.95);
      border: 2px solid rgba(138, 43, 226, 0.4);
      border-radius: 10px;
      padding: 10px;
      overflow-y: auto;
      font-size: 11px;
    }

    #logPanel h4 {
      margin: 0 0 8px 0;
      color: #a78bfa;
      font-size: 12px;
      border-bottom: 1px solid rgba(138, 43, 226, 0.3);
      padding-bottom: 6px;
    }

    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid rgba(100, 116, 139, 0.2);
      color: #94a3b8;
    }

    /* Menu Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal-content {
      background: linear-gradient(145deg, rgba(30, 30, 60, 0.98), rgba(20, 20, 40, 0.98));
      border: 2px solid rgba(138, 43, 226, 0.5);
      border-radius: 12px;
      padding: 25px;
      min-width: 250px;
      text-align: center;
    }

    .modal-content h3 {
      color: #a78bfa;
      margin-bottom: 20px;
      font-family: 'Cinzel', serif;
    }

    .modal-content button {
      display: block;
      width: 100%;
      margin: 8px 0;
    }

    /* Buff tile indicator */
    .buff-tile {
      position: absolute;
      bottom: 2px;
      left: 2px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="mainContainer">
    <!-- Card Library Panel -->
    <div id="playtestPanel">
      <h3>🧪 Card Library</h3>
      
      <input type="text" id="cardSearch" placeholder="Search cards..." />
      
      <div class="filters">
        <button class="filter-btn active" data-type="all">All</button>
        <button class="filter-btn" data-type="monster">Units</button>
        <button class="filter-btn" data-type="spell">Spells</button>
        <button class="filter-btn" data-type="structure">Structs</button>
      </div>
      
      <div class="filters">
        <button class="filter-btn active" data-deck="all">All</button>
        <button class="filter-btn" data-deck="Medieval Kingdom">Castle</button>
        <button class="filter-btn" data-deck="Western Frontier">West</button>
        <button class="filter-btn" data-deck="Void Alien">Alien</button>
        <button class="filter-btn" data-deck="Crimson Court">Vamp</button>
        <button class="filter-btn" data-deck="Jeweled Court">Fairy</button>
        <button class="filter-btn" data-deck="Elune's Chosen">Elune</button>
      </div>
      
      <div id="spawnSideSelector">
        <label class="gold">
          <input type="radio" name="spawnSide" value="gold" checked> 🟡 Gold
        </label>
        <label class="silver">
          <input type="radio" name="spawnSide" value="silver"> ⚪ Silver
        </label>
      </div>
      
      <div id="cardLibrary"></div>
      
      <div id="selectedCardPreview">
        <div class="name"></div>
        <div class="card-stats"></div>
        <div class="effect"></div>
      </div>
      
      <div class="instructions">
        <strong>How to use:</strong><br>
        1. Select a card from the library<br>
        2. Choose 🟡Gold or ⚪Silver side<br>
        3. Click on the board to spawn<br>
        4. Use End Turn to switch sides<br>
        5. All effects work as in real game!
      </div>
    </div>

    <!-- Game Area -->
    <div id="gameArea">
      <div id="controlsRow">
        <div class="heartDisplay silver">
          Silver ♥ <span id="silverHP">30</span>
        </div>
        <div id="turnLabel">GOLD's Turn</div>
        <span id="energyLabel">⚡ 99</span>
        <button id="endTurnBtn">End Turn</button>
        <button id="menuBtn">☰ Menu</button>
        <div class="heartDisplay gold">
          Gold ♥ <span id="goldHP">30</span>
        </div>
      </div>

      <div id="boardContainer">
        <div id="board"></div>
      </div>
    </div>
  </div>

  <!-- Log Panel -->
  <div id="logPanel">
    <h4>📜 Game Log</h4>
    <div id="logContent"></div>
  </div>

  <!-- Menu Modal -->
  <div id="gameMenu" class="modal">
    <div class="modal-content">
      <h3>Playtest Menu</h3>
      <button id="restartBtn">🔄 Reset Board</button>
      <button id="leaveBtn">🚪 Exit Playtest</button>
      <button id="closeMenuBtn">✕ Close</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    
    // Game state
    let allCards = [];
    let selectedCard = null;
    let currentFilter = { type: 'all', deck: 'all', search: '' };
    let gameState = null;
    
    // DOM elements
    const boardEl = document.getElementById("board");
    const logContent = document.getElementById("logContent");
    const turnLabelEl = document.getElementById("turnLabel");
    const endTurnBtn = document.getElementById("endTurnBtn");
    const cardLibrary = document.getElementById("cardLibrary");
    const cardSearch = document.getElementById("cardSearch");
    const selectedCardPreview = document.getElementById("selectedCardPreview");
    const menuBtn = document.getElementById("menuBtn");
    const gameMenu = document.getElementById("gameMenu");
    
    // Initialize playtest
    socket.emit("startPlaytest", { username: "Tester" });
    
    // Handle playtest start
    socket.on("playtestStart", (data) => {
      console.log("Playtest started:", data);
      allCards = data.allCards || [];
      renderCardLibrary();
      addLog("=== PLAYTEST MODE ===");
      addLog("Select a card, then click the board to spawn it.");
    });
    
    socket.on("role", (r) => {
      console.log("Role:", r);
    });
    
    // Handle game state updates
    socket.on("state", (data) => {
      gameState = data;
      renderBoard(data);
      updateUI(data);
    });
    
    socket.on("log", (msg) => {
      addLog(msg);
    });
    
    socket.on("combatLog", (data) => {
      addLog(data.message);
    });
    
    // Render card library
    function renderCardLibrary() {
      cardLibrary.innerHTML = '';
      
      let cards = allCards.filter(card => {
        if (currentFilter.type !== 'all' && card.type !== currentFilter.type) return false;
        if (currentFilter.deck !== 'all' && card.deck !== currentFilter.deck) return false;
        if (currentFilter.search) {
          const s = currentFilter.search.toLowerCase();
          if (!card.name.toLowerCase().includes(s) && 
              !(card.effectDesc || '').toLowerCase().includes(s) &&
              !card.key.toLowerCase().includes(s)) return false;
        }
        return true;
      });
      
      // Remove duplicates by key
      const seen = new Set();
      cards = cards.filter(c => {
        if (seen.has(c.key)) return false;
        seen.add(c.key);
        return true;
      });
      
      // Sort by cost then name
      cards.sort((a, b) => (a.cost - b.cost) || a.name.localeCompare(b.name));
      
      cards.forEach(card => {
        const el = document.createElement('div');
        el.className = 'library-card' + (selectedCard?.key === card.key ? ' selected' : '');
        
        let stats = '';
        if (card.type !== 'spell') {
          stats = `<span class="atk">⚔${card.atk}</span> <span class="hp">♥${card.hp}</span>`;
        }
        
        el.innerHTML = `
          <span class="cost">${card.cost}</span>
          <span class="card-name">${card.name}</span>
          <span class="stats">${stats}</span>
        `;
        
        el.onclick = () => selectCard(card);
        cardLibrary.appendChild(el);
      });
    }
    
    function selectCard(card) {
      selectedCard = card;
      renderCardLibrary();
      
      // Show preview
      selectedCardPreview.style.display = 'block';
      selectedCardPreview.querySelector('.name').textContent = card.name;
      selectedCardPreview.querySelector('.card-stats').textContent = 
        card.type !== 'spell' ? `⚔ ${card.atk} | ♥ ${card.hp} | Cost: ${card.cost}` : `Cost: ${card.cost} | Type: Spell`;
      selectedCardPreview.querySelector('.effect').textContent = card.effectDesc || 'No special effect';
    }
    
    // Filter handlers
    document.querySelectorAll('.filter-btn[data-type]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn[data-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter.type = btn.dataset.type;
        renderCardLibrary();
      };
    });
    
    document.querySelectorAll('.filter-btn[data-deck]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn[data-deck]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter.deck = btn.dataset.deck;
        renderCardLibrary();
      };
    });
    
    cardSearch.oninput = () => {
      currentFilter.search = cardSearch.value;
      renderCardLibrary();
    };
    
    // Render board
    function renderBoard(data) {
      boardEl.innerHTML = '';
      
      for (let r = 0; r < 7; r++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        
        // Row label
        const labelEl = document.createElement('div');
        labelEl.className = 'row-label';
        labelEl.textContent = String.fromCharCode(65 + r);
        rowEl.appendChild(labelEl);
        
        for (let c = 0; c < 6; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          
          // Row ownership coloring
          if (r <= 1) cell.classList.add('gold-row');
          if (r >= 5) cell.classList.add('silver-row');
          
          // Buff tile indicator
          if (data.buffTiles) {
            const key = `${r}-${c}`;
            if (data.buffTiles[key]) {
              const buffEl = document.createElement('div');
              buffEl.className = 'buff-tile';
              buffEl.textContent = data.buffTiles[key].icon || '✨';
              buffEl.title = data.buffTiles[key].name;
              cell.appendChild(buffEl);
            }
          }
          
          // Row HP display for home rows
          if ((r <= 1 || r >= 5) && data.rowHP && data.rowHP[r] > 0) {
            const hpEl = document.createElement('div');
            hpEl.className = 'row-hp';
            hpEl.textContent = '🛡' + data.rowHP[r];
            cell.appendChild(hpEl);
          }
          
          // Unit display
          const unitId = data.board[r][c];
          if (unitId && data.units[unitId]) {
            const unit = data.units[unitId];
            const unitEl = document.createElement('div');
            unitEl.className = `unit ${unit.owner}`;
            
            const hp = unit.displayHp !== undefined ? unit.displayHp : unit.hp;
            const maxHp = unit.displayMaxHp !== undefined ? unit.displayMaxHp : (unit.maxHp || unit.hp);
            
            unitEl.innerHTML = `
              <img class="unit-art" src="${unit.art || '/images/default.png'}" onerror="this.style.display='none'" />
              <div class="unit-name">${unit.name}</div>
              <div class="unit-stats">
                <span class="atk">⚔${unit.atk}</span>
                <span class="hp">♥${hp}</span>
              </div>
            `;
            cell.appendChild(unitEl);
          }
          
          // Click handler for spawning
          cell.onclick = () => onCellClick(r, c);
          
          rowEl.appendChild(cell);
        }
        
        boardEl.appendChild(rowEl);
      }
      
      // Update heart HP
      if (data.heartHP) {
        document.getElementById('silverHP').textContent = data.heartHP.silver;
        document.getElementById('goldHP').textContent = data.heartHP.gold;
      }
    }
    
    function onCellClick(row, col) {
      if (!selectedCard) {
        addLog("⚠️ Select a card from the library first!");
        return;
      }
      
      const side = document.querySelector('input[name="spawnSide"]:checked').value;
      
      socket.emit("action", {
        type: "playtestSpawn",
        cardKey: selectedCard.key,
        row: row,
        col: col,
        side: side
      });
    }
    
    function updateUI(data) {
      if (data.activeSide) {
        turnLabelEl.textContent = data.activeSide.toUpperCase() + "'s Turn";
        turnLabelEl.className = data.activeSide;
      }
    }
    
    function addLog(msg) {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = msg;
      logContent.appendChild(entry);
      logContent.scrollTop = logContent.scrollHeight;
      
      // Keep log manageable
      while (logContent.children.length > 50) {
        logContent.removeChild(logContent.firstChild);
      }
    }
    
    // End turn
    endTurnBtn.onclick = () => {
      socket.emit("action", { type: "playtestSwitchSide" });
    };
    
    // Menu
    menuBtn.onclick = () => {
      gameMenu.style.display = 'flex';
    };
    
    document.getElementById('closeMenuBtn').onclick = () => {
      gameMenu.style.display = 'none';
    };
    
    document.getElementById('restartBtn').onclick = () => {
      socket.emit("startPlaytest", { username: "Tester" });
      gameMenu.style.display = 'none';
      logContent.innerHTML = '';
      addLog("=== BOARD RESET ===");
    };
    
    document.getElementById('leaveBtn').onclick = () => {
      window.location.href = '/home.html';
    };
    
    // Close menu on outside click
    gameMenu.onclick = (e) => {
      if (e.target === gameMenu) gameMenu.style.display = 'none';
    };
  </script>
</body>
</html>
